<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trinetra Preview: Coordinator Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  tailwind.config = {
    darkMode: "class",

      extend: {
        "colors": {
                "on-primary": "#ffffff",
                "on-secondary-fixed-variant": "#584329",

                "inverse-on-surface": "#f3f0ef",
                "on-tertiary-fixed-variant": "#474744",
                "surface-container-low": "#f6f3f2",
                "outline": "#737872",
                "surface-bright": "#fcf9f8",
                "inverse-primary": "#b7ccb9",
                "tertiary-fixed-dim": "#c8c6c2",
                "on-tertiary": "#ffffff",
                "on-primary-container": "#9eb2a0",
                "error-container": "#ffdad6",
                "tertiary-container": "#41413e",
                "primary-container": "#334537",
                "on-secondary": "#ffffff",
                "surface-container-high": "#eae7e7",
                "surface": "#fcf9f8",
                "secondary-fixed": "#fdddba",
                "on-error": "#ffffff",
                "surface-dim": "#dcd9d8",
                "background": "#fcf9f8",
                "stone-bg": "#F5F2ED",
                "on-primary-fixed": "#0e1f13",
                "on-surface-variant": "#434843",
                "on-tertiary-fixed": "#1b1c19",
                "surface-tint": "#506354",
                "surface-container-highest": "#e4e2e1",
                "secondary": "#715a3e",
                "sage-primary": "#4A5D4E",
                "primary": "#1d2f22",
                "on-secondary-container": "#765f42",
                "tertiary": "#2b2b28",
                "secondary-container": "#fadab7",
                "primary-fixed-dim": "#b7ccb9",
                "earth-accent": "#8C7355",
                "charcoal-text": "#2C2C2C",
                "secondary-fixed-dim": "#e0c19f",
                "on-error-container": "#93000a",
                "on-secondary-fixed": "#281803",
                "error": "#ba1a1a",
                "surface-container": "#f0edec",
                "on-primary-fixed-variant": "#394b3d",
                "primary-fixed": "#d3e8d4",
                "outline-variant": "#c3c8c1",
                "on-surface": "#1b1c1b",
                "surface-container-lowest": "#ffffff",
                "soft-olive": "#74826B",
                "inverse-surface": "#303030"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "margin-mobile": "24px",
                "margin-desktop": "80px",
                "touch-target": "88px",
                "section-gap": "48px",
                "gutter": "24px"
        },
        "fontFamily": {
                "headline-lg": [
                        "Plus Jakarta Sans"
                ],
                "display-lg": [
                        "Plus Jakarta Sans"
                ],
                "label-sm": [
                        "Plus Jakarta Sans"
                ],
                "headline-lg-mobile": [
                        "Plus Jakarta Sans"
                ],
                "body-md": [
                        "Plus Jakarta Sans"
                ],
                "body-lg": [
                        "Plus Jakarta Sans"
                ]
        },
        "fontSize": {
                "headline-lg": [
                        "32px",

                                "fontWeight": "600"

                ],
                "display-lg": [
                        "48px",
                        {

                                "letterSpacing": "-0.02em",
                                "fontWeight": "700"

                "label-sm": [
                        "14px",

                "headline-lg-mobile": [

                                "fontWeight": "600"

                "body-md": [
                        "18px",
                        {
                                "lineHeight": "28px",
                                "fontWeight": "400"
                        }
                ],
                "body-lg": [
                        "20px",
                        {

        },
        animation: {
          'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
        }

<style>
    body {
      min-height: max(884px, 100dvh);
      background-color: transparent;
    }
  </style>
</head>
<body class="text-on-surface font-body-lg min-h-screen flex flex-col items-center relative bg-background">
<!-- Fluid Background -->
<!-- TopAppBar -->
<header class="bg-surface/50 backdrop-blur-xl border-b border-outline-variant/20 flex justify-between items-center w-full px-margin-mobile h-touch-target fixed top-0 z-40 docked full-width top-0 flat no shadows">
<button class="text-primary hover:bg-surface-container-low transition-colors opacity-70 w-[88px] h-[88px] flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu" style="font-variation-settings: 'FILL' 1; font-size: 32px;">menu</span>
</button>
<h1 class="font-display-lg text-headline-lg flex items-center tracking-tight">
<span class="text-[#FF9933]">t</span>
<span class="text-[#FFFFFF] drop-shadow-[0_1px_2px_rgba(0,0,0,0.5)]">r</span>
<span class="text-[#138808]">i</span>
<span class="font-bold text-primary uppercase ml-1">NETRA</span>
</h1>
<button class="text-primary hover:bg-surface-container-low transition-colors opacity-70 w-[88px] h-[88px] flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="close" style="font-variation-settings: 'FILL' 1; font-size: 32px;">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[600px] mt-touch-target mb-[120px] px-margin-mobile py-gutter flex flex-col gap-6 h-full z-10">
<!-- Threat Level / Disaster Rating Bar -->
<div class="w-full bg-surface/80 backdrop-blur-md rounded-xl p-6 flex flex-col gap-4 shadow-sm border border-outline-variant/30 mt-2 transition-all duration-300 hover:shadow-md">
<div class="flex justify-between items-end">
<div>
<span class="font-label-sm text-on-surface-variant uppercase tracking-wider block mb-1">Disaster Threat Level</span>
<span class="font-display-lg text-error leading-none flex items-center gap-2">High <span class="w-3 h-3 rounded-full bg-error animate-pulse-slow"></span></span>
</div>
<div class="text-right">
<span class="font-headline-lg text-on-surface leading-none block">85<span class="text-body-md text-on-surface-variant">/100</span></span>
</div>
</div>
<!-- Rating Bar -->
<div class="w-full h-3 bg-surface-variant/50 rounded-full overflow-hidden flex">
<div class="h-full bg-error w-[85%] rounded-full opacity-80 transition-all duration-1000 ease-out"></div>
</div>
<!-- Urgency Engine Factors -->
<div class="flex gap-2 flex-wrap mt-2">
<span class="px-2 py-1 bg-error/10 text-error text-[12px] font-bold rounded-md border border-error/20 backdrop-blur-sm transition-all hover:bg-error/20">Threat to Life: 90</span>
<span class="px-2 py-1 bg-sage-primary/10 text-sage-primary text-[12px] font-bold rounded-md border border-sage-primary/20 backdrop-blur-sm transition-all hover:bg-sage-primary/20">Medical: 80</span>
<span class="px-2 py-1 bg-on-surface-variant/10 text-on-surface text-[12px] font-bold rounded-md border border-outline-variant/30 backdrop-blur-sm transition-all hover:bg-on-surface-variant/20">Property: 40</span>
<span class="px-2 py-1 bg-tertiary/10 text-tertiary text-[12px] font-bold rounded-md border border-tertiary/20 backdrop-blur-sm transition-all hover:bg-tertiary/20">Security: 65</span>
</div>
</div>
<!-- Voice Stress Indicator -->
<div class="w-full bg-surface/80 backdrop-blur-md rounded-xl p-6 flex flex-col items-center justify-center min-h-[88px] shadow-sm border border-outline-variant/30 transition-all duration-300 hover:shadow-md">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-3 uppercase tracking-wider">Voice Stress Analysis</span>
<div class="w-full h-2 bg-surface-variant/50 rounded-full overflow-hidden mb-3">
<div class="h-full bg-earth-accent opacity-70 w-3/4 rounded-full transition-all duration-1000 ease-out"></div> <!-- Simulating high stress -->
</div>
<span class="font-label-sm text-label-sm text-earth-accent mt-1 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-earth-accent animate-pulse-slow"></span> Elevated Arousal Detected</span>
</div>
<!-- Binary Triage Questioning -->
<section class="flex flex-col gap-5 mt-2 flex-1">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-center text-primary mb-1 drop-shadow-sm">Are you in immediate danger?</h2>
<div class="grid grid-cols-2 gap-4">
<button class="h-[140px] w-full bg-surface/50 backdrop-blur-lg border border-outline-variant/40 hover:bg-surface/70 active:scale-95 transition-all flex flex-col items-center justify-center gap-3 rounded-xl shadow-sm hover:shadow-md">
<span class="material-symbols-outlined text-sage-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1; font-size: 48px;">check_circle</span>
<span class="font-display-lg text-display-lg text-sage-primary">YES</span>
</button>
<button class="h-[140px] w-full bg-surface/50 backdrop-blur-lg border border-outline-variant/40 hover:bg-surface/70 active:scale-95 transition-all flex flex-col items-center justify-center gap-3 rounded-xl shadow-sm hover:shadow-md">
<span class="material-symbols-outlined text-outline" data-icon="cancel" style="font-variation-settings: 'FILL' 0; font-size: 48px;">cancel</span>
<span class="font-display-lg text-display-lg text-outline">NO</span>
</button>
</div>
</section>
<!-- Incident Categories (Glassmorphic Icons) -->
<section class="mt-4 flex-1">
<h2 class="font-label-sm text-label-sm text-on-surface-variant text-center mb-5 uppercase tracking-wider">Select Incident Type</h2>
<div class="grid grid-cols-2 gap-4">
<!-- Fire -->
<button class="h-[140px] w-full bg-surface/50 backdrop-blur-lg border border-outline-variant/40 hover:bg-surface/70 active:scale-95 transition-all flex flex-col items-center justify-center gap-3 rounded-xl shadow-sm hover:shadow-md"><span class="material-symbols-outlined text-sage-primary" style="font-variation-settings: 'FILL' 0, 'wght' 200; font-size: 48px;">mode_heat</span><span class="font-label-sm text-sage-primary uppercase tracking-wider">Fire</span></button>
<!-- Medical -->
<button class="h-[140px] w-full bg-surface/50 backdrop-blur-lg border border-outline-variant/40 hover:bg-surface/70 active:scale-95 transition-all flex flex-col items-center justify-center gap-3 rounded-xl shadow-sm hover:shadow-md"><span class="material-symbols-outlined text-sage-primary" style="font-variation-settings: 'FILL' 0, 'wght' 200; font-size: 48px;">ecg_heart</span><span class="font-label-sm text-sage-primary uppercase tracking-wider">Medical</span></button>
<!-- Flood -->
<button class="h-[140px] w-full bg-surface/50 backdrop-blur-lg border border-outline-variant/40 hover:bg-surface/70 active:scale-95 transition-all flex flex-col items-center justify-center gap-3 rounded-xl shadow-sm hover:shadow-md"><span class="material-symbols-outlined text-sage-primary" style="font-variation-settings: 'FILL' 0, 'wght' 200; font-size: 48px;">water_drop</span><span class="font-label-sm text-sage-primary uppercase tracking-wider">Flood</span></button>
<!-- Security -->
<button class="h-[140px] w-full bg-surface/50 backdrop-blur-lg border border-outline-variant/40 hover:bg-surface/70 active:scale-95 transition-all flex flex-col items-center justify-center gap-3 rounded-xl shadow-sm hover:shadow-md"><span class="material-symbols-outlined text-sage-primary" style="font-variation-settings: 'FILL' 0, 'wght' 200; font-size: 48px;">shield</span><span class="font-label-sm text-sage-primary uppercase tracking-wider">Security</span></button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface/80 backdrop-blur-2xl border-t border-outline-variant/30 fixed bottom-0 w-full z-50 rounded-t-xl left-0 flex justify-around items-center px-4 pb-4 pt-2 shadow-[0_-8px_32px_rgba(140,115,85,0.06)] md:hidden">
<button class="flex flex-col items-center justify-center text-outline p-2 hover:text-primary transition-all duration-200 active:scale-95 w-20">
<span class="material-symbols-outlined mb-1" data-icon="home" style="font-variation-settings: 'FILL' 0; font-size: 24px;">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-outline p-2 hover:text-primary transition-all duration-200 active:scale-95 w-20">
<span class="material-symbols-outlined mb-1" data-icon="hub" style="font-variation-settings: 'FILL' 0; font-size: 24px;">hub</span>
<span class="font-label-sm text-label-sm">Mesh</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container/80 backdrop-blur-md text-on-secondary-container rounded-full px-6 py-2 duration-200 active:scale-95 border border-secondary/20">
<span class="material-symbols-outlined mb-1" data-icon="medical_services" style="font-variation-settings: 'FILL' 1; font-size: 24px;">medical_services</span>
<span class="font-label-sm text-label-sm">Triage</span>
</button>
<button class="flex flex-col items-center justify-center text-outline p-2 hover:text-primary transition-all duration-200 active:scale-95 w-20">
<span class="material-symbols-outlined mb-1" data-icon="map" style="font-variation-settings: 'FILL' 0; font-size: 24px;">map</span>
<span class="font-label-sm text-label-sm">Maps</span>
</button>
</nav>
</body></html>
